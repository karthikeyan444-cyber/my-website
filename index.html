<!DOCTYPE html>
<html>
<head>
    <title>My Powerlifting Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MY POWERLIFTING DASHBOARD</h1>

    <div class="container">

        <div class="card">
            <h2>🏋️ BENCH PRESS</h2>
            <p id="bench">90 KG</p>
        </div>

        <div class="card">
            <h2>🦵 SQUAT</h2>
            <p id="squat">105 KG</p>
        </div>

        <div class="card">
            <h2>💀 DEADLIFT</h2>
            <p id="deadlift">135 KG</p>
        </div>

    </div>

    <h2>Total: <span id="total">330 KG</span></h2>

    <button onclick="showMessage()">CLICK ME</button>

    <script src="script.js"></script>

</body>
</html>
